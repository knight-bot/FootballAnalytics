name: Collect Original Historical Provider Evidence

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date (YYYY-MM-DD)"
        required: true
        type: string
        default: "2025-09-12"
      end_date:
        description: "Historical end date (YYYY-MM-DD)"
        required: true
        type: string
        default: "2025-09-25"
      max_pairs:
        description: "Maximum candidate pairs to check"
        type: choice
        required: true
        options:
          - "5"
          - "10"
        default: "10"

permissions:
  contents: read

jobs:
  collect_original_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source records and review scripts
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install authenticated request dependency
        run: python -m pip install requests

      - name: Test read-only source evidence rules
        run: |
          python -m py_compile collect_original_provider_evidence.py
          python -m unittest -q test_collect_original_provider_evidence.py

      - name: Fetch original records with existing GitHub secrets
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
          EVIDENCE_START_DATE: ${{ inputs.start_date }}
          EVIDENCE_END_DATE: ${{ inputs.end_date }}
          EVIDENCE_MAX_PAIRS: ${{ inputs.max_pairs }}
        run: python collect_original_provider_evidence.py

      - name: Upload sanitized evidence for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: original-historical-source-evidence
          path: historical_provider_evidence/
          retention-days: 14
          if-no-files-found: error
