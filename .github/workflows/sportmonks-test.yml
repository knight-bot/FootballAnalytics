name: Test Sportmonks Historical Data Access

on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: "Historical fixture ID to test"
        required: true
        default: "19872618"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Inspect accessible historical data fields
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_FIXTURE_ID: ${{ inputs.fixture_id }}
        run: python sportmonks_probe.py
