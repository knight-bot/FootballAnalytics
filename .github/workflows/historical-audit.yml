name: Audit Historical Football Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install requests

      - name: Check research report and audit Python syntax
        run: |
          python -m py_compile historical_audit.py audit_history_cli.py
          python -m py_compile historical_reports.py
          python -m py_compile pages/4_Historical_Data_Audit.py
          python -m py_compile pages/5_Historical_Research_Reports.py

      - name: Run offline database and historical-report tests
        run: |
          python -m unittest -q \
            test_sportmonks_historical_import.py \
            test_historical_audit.py \
            test_historical_reports.py

      - name: Summarize historical data quality
        run: python audit_history_cli.py
