name: Audit Historical Football Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install requests

      - name: Check research and evidence Python syntax
        run: |
          python -m py_compile historical_audit.py audit_history_cli.py
          python -m py_compile historical_reports.py historical_evidence.py historical_ai.py
          python -m py_compile sportmonks_historical_batch.py
          python -m py_compile chatgpt_research_export.py
          python -m py_compile historical_fixture_linkage.py confirm_historical_link.py
          python -m py_compile historical_team_strength.py pages/9_Historical_Team_Strength.py
          python -m py_compile historical_model_benchmark.py pages/10_Historical_Model_Benchmark.py
          python -m py_compile historical_multiseason_benchmark.py pages/11_Multi_Season_Historical_Evaluation.py
          python -m py_compile historical_xg_analysis.py pages/12_Historical_xG_Analysis.py
          python -m py_compile historical_coverage_matrix.py pages/13_Historical_Coverage_Audit.py
          python -m py_compile pages/8_Historical_Fixture_Link_Review.py
          python -m py_compile pages/7_ChatGPT_Research_Export.py
          python -m py_compile pages/4_Historical_Data_Audit.py
          python -m py_compile pages/5_Historical_Research_Reports.py
          python -m py_compile pages/6_Historical_Evidence_Research.py

      - name: Run offline historical research and evidence tests
        run: |
          python -m unittest -q \
            test_sportmonks_historical_import.py \
            test_historical_audit.py \
            test_historical_reports.py \
            test_historical_evidence_ai.py \
            test_sportmonks_historical_batch.py \
            test_chatgpt_research_export.py \
            test_historical_fixture_linkage.py \
            test_historical_team_strength.py \
            test_historical_model_benchmark.py \
            test_historical_multiseason_benchmark.py \
            test_historical_xg_analysis.py \
            test_historical_coverage_matrix.py

      - name: Summarize historical data quality
        run: python audit_history_cli.py
