name: Discover and Import Historical Sportmonks Fixtures

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date (YYYY-MM-DD, at least 14 days ago)"
        required: true
        type: string
        default: "2026-10-17"
      end_date:
        description: "Historical end date (up to 14 inclusive days per run)"
        required: true
        type: string
        default: "2026-10-21"
      max_fixtures:
        description: "Completed fixtures imported per run"
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "10"
        default: "5"
      refresh_existing:
        description: "Re-import completed fixtures already saved?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: football-database-update
  cancel-in-progress: false

jobs:
  import_completed_history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Check importer syntax
        run: |
          python -m py_compile sportmonks_historical_batch.py
          python -m py_compile sportmonks_historical_import.py

      - name: Run offline batch and database tests
        run: |
          python -m unittest -q \
            test_sportmonks_historical_import.py \
            test_sportmonks_historical_batch.py

      - name: Discover and import completed historical fixtures
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          HISTORY_START_DATE: ${{ inputs.start_date }}
          HISTORY_END_DATE: ${{ inputs.end_date }}
          HISTORY_LEAGUE_ID: "8"
          HISTORY_MAX_FIXTURES: ${{ inputs.max_fixtures }}
          HISTORY_REFRESH_EXISTING: ${{ inputs.refresh_existing }}
        run: python sportmonks_historical_batch.py

      - name: Save historical database updates
        run: |
          if [ -n "$(git status --porcelain football.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add football.db
            git commit -m "Import discovered completed historical Sportmonks fixtures"
            git push
          else
            echo "No historical database change."
          fi
