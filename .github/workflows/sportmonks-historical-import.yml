name: Import Sportmonks Historical Matches

on:
  workflow_dispatch:
    inputs:
      fixture_ids:
        description: "1-5 completed historical Sportmonks fixture IDs, comma-separated"
        required: true
        type: string
        default: "19872618"

permissions:
  contents: write

# Share a concurrency lock with the existing database updater.
concurrency:
  group: football-database-update
  cancel-in-progress: false

jobs:
  import_history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Import completed historical fixtures
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          SPORTMONKS_HISTORICAL_FIXTURE_IDS: ${{ inputs.fixture_ids }}
        run: python sportmonks_historical_import.py

      - name: Commit updated SQLite database
        run: |
          if [ -n "$(git status --porcelain football.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add football.db
            git commit -m "Import verified Sportmonks historical metrics"
            git push
          else
            echo "No database changes."
          fi
