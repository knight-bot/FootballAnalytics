
name: Update Football Database

# ==========================================
# 1. WHEN TO RUN
# ==========================================

on:
  schedule:
    # Run every day at 02:37 UTC
    # 10:37 AM Singapore time
    - cron: '37 2 * * *'

  # Allow manual execution
  workflow_dispatch:

# Allow GitHub to save database changes
permissions:
  contents: write

# Prevent overlapping database updates
concurrency:
  group: football-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ====================================
      # STEP 1: DOWNLOAD REPOSITORY
      # ====================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================
      # STEP 2: SET UP PYTHON
      # ====================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ====================================
      # STEP 3: INSTALL LIBRARIES
      # ====================================

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ====================================
      # STEP 4: COLLECT RECENT MATCHES
      # ====================================

      - name: Collect completed matches
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: python update_matches.py

      # ====================================
      # STEP 5: IMPORT HISTORICAL MATCHES
      # Runs only when manually triggered
      # ====================================

      - name: Import historical Premier League matches
        if: github.event_name == 'workflow_dispatch'
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: python backfill_2025.py

      # ====================================
      # STEP 6: SAVE SQLITE DATABASE
      # ====================================

      - name: Save updated database
        run: |
          if [ -n "$(git status --porcelain football.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add football.db
            git commit -m "Update football database"
            git push
          else
            echo "Database unchanged."
          fi

      # ====================================
      # STEP 7: CONFIRM COMPLETION
      # ====================================

      - name: Confirm successful update
        run: |
          echo "Football database workflow completed!"
