
name: Update Football Database

on:
  schedule:
    - cron: '37 2 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install requests

      - name: Collect completed matches
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: python update_matches.py

      - name: Save updated database
        run: |
          if [ -n "$(git status --porcelain football.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add football.db
            git commit -m "Update football database"
            git push
          else
            echo "Database unchanged."
          fi
